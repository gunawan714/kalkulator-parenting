<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pola Asuh Digital Interaktif</title>

<style>
:root{
    --navy:#0A2F44;
    --gold:#F2C94C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg,#0A2F44,#123f58);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    animation:fadeIn .6s ease;
}

.header{
    background:var(--navy);
    color:white;
    padding:24px;
    text-align:center;
}

.header h1{
    font-size:1.4rem;
    line-height:1.4;
}

.header p{
    opacity:.85;
    margin-top:8px;
    font-size:.9rem;
}

.content{
    padding:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:var(--navy);
}

select{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:var(--gold);
    color:#222;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.result{
    display:none;
    margin-top:20px;
    animation:slideUp .6s ease;
}

.score-box{
    text-align:center;
    background:#f7f9fb;
    border-radius:16px;
    padding:18px;
}

.score{
    font-size:48px;
    font-weight:800;
    color:var(--navy);
}

.color-card{
    margin-top:15px;
    border-radius:12px;
    padding:14px;
    color:white;
    font-weight:bold;
    text-align:center;
}

.tip-box{
    margin-top:15px;
    background:#fff8df;
    border-left:5px solid var(--gold);
    padding:14px;
    border-radius:10px;
    line-height:1.5;
}

.whatsapp{
    margin-top:15px;
    background:#25D366;
    color:white;
}

.whatsapp:hover{
    opacity:.9;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.confetti{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    animation:fall linear forwards;
    z-index:999;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Kalkulator Pola Asuh Digital</h1>
        <p>Temukan rekomendasi singkat sesuai kebiasaan digital anak Anda</p>
    </div>

    <div class="content">

        <div class="form-group">
            <label>Usia anak?</label>
            <select id="usia">
                <option value="2-5">2–5 tahun</option>
                <option value="6-9">6–9 tahun</option>
                <option value="10-12">10–12 tahun</option>
            </select>
        </div>

        <div class="form-group">
            <label>Reaksi anak saat screen time habis?</label>
            <select id="reaksi">
                <option value="tenang">Tenang</option>
                <option value="merengek">Merengek</option>
                <option value="tantrum">Tantrum</option>
                <option value="agresif">Agresif</option>
            </select>
        </div>

        <div class="form-group">
            <label>Aplikasi favorit anak?</label>
            <select id="aplikasi">
                <option value="youtube">YouTube Kids</option>
                <option value="game">Game Online</option>
                <option value="medsos">Media Sosial</option>
                <option value="belajar">Belajar Interaktif</option>
            </select>
        </div>

        <button class="btn-primary" onclick="hitungSkor()">
            Lihat Hasil
        </button>

        <div id="hasil" class="result">

            <div class="score-box">
                <div>Skor Keseimbangan Digital</div>
                <div class="score" id="scoreValue">100</div>
            </div>

            <div id="warnaCard" class="color-card"></div>

            <div class="tip-box">
                <strong>Tips 3 Menit Hari Ini:</strong>
                <p id="tipsText"></p>
            </div>

            <button class="whatsapp"
                    onclick="alert('Tips akan dikirim ke nomor WhatsApp Anda (demo)')">
                Kirim ke WhatsApp
            </button>

        </div>

    </div>
</div>

<script>

function hitungSkor(){

    const usia = document.getElementById("usia").value;
    const reaksi = document.getElementById("reaksi").value;
    const aplikasi = document.getElementById("aplikasi").value;

    let skor = 100;

    if(usia === "6-9") skor -= 5;

    if(reaksi === "tantrum") skor -= 20;
    if(reaksi === "agresif") skor -= 30;
    if(reaksi === "merengek") skor -= 10;

    if(aplikasi === "medsos") skor -= 15;
    if(aplikasi === "belajar") skor += 10;

    skor = Math.max(0, Math.min(100, skor));

    document.getElementById("scoreValue").innerText = skor;

    const warnaCard = document.getElementById("warnaCard");

    let warnaNama = "";
    let warnaHex = "";

    switch(aplikasi){
        case "youtube":
            warnaNama = "Kuning Fokus";
            warnaHex = "#F2C94C";
            break;

        case "game":
            warnaNama = "Ungu Fokus";
            warnaHex = "#8E44AD";
            break;

        case "belajar":
            warnaNama = "Hijau Fokus";
            warnaHex = "#27AE60";
            break;

        case "medsos":
            warnaNama = "Oranye Fokus";
            warnaHex = "#F2994A";
            break;
    }

    warnaCard.style.background = warnaHex;
    warnaCard.innerHTML =
        "Warna Fokus yang Direkomendasikan: <br><strong>" +
        warnaNama + "</strong>";

    const tips = [

        "Buat ritual 3 menit sebelum gadget dimatikan: hitung mundur bersama lalu berikan pelukan atau high-five.",

        "Ajak anak menceritakan satu hal paling menarik yang ditonton hari ini selama 3 menit penuh tanpa interupsi.",

        "Tempelkan jadwal screen time sederhana dan biarkan anak memberi tanda centang setelah berhasil mematuhinya.",

        "Gunakan timer visual dan lakukan aktivitas fisik ringan selama 3 menit setelah layar dimatikan.",

        "Tanyakan tiga pertanyaan reflektif: Apa yang dipelajari? Apa yang menyenangkan? Apa yang ingin dilakukan besok?"
    ];

    let index = 0;

    if(aplikasi === "belajar") index = 4;
    else if(aplikasi === "youtube") index = 1;
    else if(aplikasi === "game") index = 3;
    else if(aplikasi === "medsos") index = 2;

    if(reaksi === "tantrum" || reaksi === "agresif"){
        index = 0;
    }

    document.getElementById("tipsText").innerText = tips[index];

    document.getElementById("hasil").style.display = "block";

    if(skor >= 80){
        confetti();
    }
}

function confetti(){

    const colors = [
        "#F2C94C",
        "#0A2F44",
        "#27AE60",
        "#8E44AD",
        "#F2994A"
    ];

    for(let i=0;i<80;i++){

        const piece = document.createElement("div");

        piece.classList.add("confetti");

        piece.style.left = Math.random()*100 + "vw";
        piece.style.top = "-10px";
        piece.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        piece.style.animationDuration =
            (Math.random()*3+2) + "s";

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },5000);
    }
}
</script>

</body>
</html>
